name: M0 Stability CI

on:
  push:
    branches: [main, 'fix/**', 'qa/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (report only)
        if: always()
        run: |
          mkdir -p qa-artifacts
          npm audit --json > qa-artifacts/npm-audit.json || true
          node -e "const a=require('./qa-artifacts/npm-audit.json'); console.log('Audit vulnerabilities:',JSON.stringify(a.metadata?.vulnerabilities ?? {}))"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke QA
        run: node qa/m0-browser-smoke.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-qa-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
